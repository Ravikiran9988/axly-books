name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, migration smoke test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axly_books_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axly_books_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Smoke-test migrations on disposable PostgreSQL
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axly_books_test
        run: |
          set -euo pipefail
          node -e "const journal = require('./drizzle/meta/_journal.json'); console.log(journal.entries.map(entry => entry.tag + '.sql').join('\\n'))" |
          while IFS= read -r migration; do
            echo "Applying migration: $migration"
            psql "$MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "drizzle/$migration"
          done

      - name: Verify migrated database schema invariants
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axly_books_test
        run: psql "$MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/database_schema_smoke.sql

      - name: Run ESLint
        run: npm run lint

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Run automated tests
        run: npm test

      - name: Build production application
        run: npm run build
